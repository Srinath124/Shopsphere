version: '3.8'

networks:
  shopsphere-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: shopsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password_here}
      POSTGRES_DB: auth_db
      POSTGRES_MULTIPLE_DATABASES: "product_db,order_db,inventory_db,notification_db"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopsphere} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-net

  redis:
    image: redis:7-alpine
    container_name: shopsphere-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shopsphere-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-net

  # ===========================================================================
  # Microservices
  # ===========================================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: shopsphere-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shopsphere}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password_here}
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uU2hvcFNwaGVyZUNhcHN0b25lUHJvamVjdA==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-net

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: shopsphere-product-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shopsphere}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password_here}
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uU2hvcFNwaGVyZUNhcHN0b25lUHJvamVjdA==}
    ports:
      - "${PRODUCT_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-net

  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: shopsphere-cart-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uU2hvcFNwaGVyZUNhcHN0b25lUHJvamVjdA==}
      PRODUCT_SERVICE_URL: http://product-service:8082
    ports:
      - "${CART_SERVICE_PORT:-8083}:8083"
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-net

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: shopsphere-inventory-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shopsphere}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password_here}
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uU2hvcFNwaGVyZUNhcHN0b25lUHJvamVjdA==}
    ports:
      - "${INVENTORY_SERVICE_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-net

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: shopsphere-order-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shopsphere}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password_here}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uU2hvcFNwaGVyZUNhcHN0b25lUHJvamVjdA==}
      INVENTORY_SERVICE_URL: http://inventory-service:8085
    ports:
      - "${ORDER_SERVICE_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: shopsphere-notification-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shopsphere}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password_here}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uU2hvcFNwaGVyZUNhcHN0b25lUHJvamVjdA==}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8086}:8086"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-net

  # ===========================================================================
  # Frontend Client
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
    networks:
      - shopsphere-net

  # ===========================================================================
  # Reverse Proxy / Gateway
  # ===========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: shopsphere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - product-service
      - cart-service
      - order-service
      - inventory-service
      - notification-service
    networks:
      - shopsphere-net
