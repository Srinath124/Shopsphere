apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopsphere-dev

bases:
  - ../../base

namePrefix: dev-

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

images:
  - name: ghcr.io/your-org/auth-service
    newTag: dev
  - name: ghcr.io/your-org/product-service
    newTag: dev
  - name: ghcr.io/your-org/cart-service
    newTag: dev
  - name: ghcr.io/your-org/order-service
    newTag: dev
  - name: ghcr.io/your-org/inventory-service
    newTag: dev
  - name: ghcr.io/your-org/notification-service
    newTag: dev
  - name: ghcr.io/your-org/frontend
    newTag: dev
