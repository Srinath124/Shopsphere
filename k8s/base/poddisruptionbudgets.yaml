# =============================================================================
# PodDisruptionBudgets for ShopSphere microservices
# Ensures high availability during voluntary disruptions (node drains, rolling
# updates, cluster upgrades). minAvailable = 1 for base; overlays override.
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  labels:
    app: auth-service
    app.kubernetes.io/part-of: shopsphere
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
---
