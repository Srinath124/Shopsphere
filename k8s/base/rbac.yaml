  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: order-service-binding
  labels:
    app: order-service
    app.kubernetes.io/part-of: shopsphere
subjects:
