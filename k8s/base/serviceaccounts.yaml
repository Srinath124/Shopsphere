# =============================================================================
# ServiceAccounts for all ShopSphere microservices
# Each service runs under its own dedicated ServiceAccount for least-privilege.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  labels:
    app: auth-service
    app.kubernetes.io/part-of: shopsphere
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service
  labels:
    app: product-service
    app.kubernetes.io/part-of: shopsphere
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cart-service
  labels:
    app: cart-service
    app.kubernetes.io/part-of: shopsphere
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  labels:
    app: order-service
    app.kubernetes.io/part-of: shopsphere
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-service
  labels:
    app: inventory-service
    app.kubernetes.io/part-of: shopsphere
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  labels:
    app: notification-service
    app.kubernetes.io/part-of: shopsphere
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/part-of: shopsphere
automountServiceAccountToken: false
