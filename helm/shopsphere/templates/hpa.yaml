{{/*
Helm HPA template for ShopSphere.
Renders HorizontalPodAutoscalers for each enabled service when autoscaling is enabled.
*/}}
{{- if .Values.autoscaling.enabled }}
{{- $root := . }}
{{- $services := dict
  "auth-service"         .Values.services.authService
  "product-service"      .Values.services.productService
  "cart-service"         .Values.services.cartService
  "order-service"        .Values.services.orderService
  "inventory-service"    .Values.services.inventoryService
  "notification-service" .Values.services.notificationService
}}
{{- range $name, $cfg := $services }}
{{- if $cfg.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-hpa
  labels:
    app: {{ $name }}
    {{- include "shopsphere.labels" $root | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $root.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $root.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.autoscaling.targetMemoryUtilizationPercentage | default 80 }}
{{- end }}
{{- end }}
{{- end }}
