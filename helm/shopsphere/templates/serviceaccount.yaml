{{/*
Helm ServiceAccount template for ShopSphere.
Creates one ServiceAccount per enabled microservice.
Each ServiceAccount has automountServiceAccountToken disabled for security.
*/}}
{{- $root := . }}
{{- $services := dict
  "auth-service"         .Values.services.authService
  "product-service"      .Values.services.productService
  "cart-service"         .Values.services.cartService
  "order-service"        .Values.services.orderService
  "inventory-service"    .Values.services.inventoryService
  "notification-service" .Values.services.notificationService
  "frontend"             .Values.services.frontend
}}
{{- range $name, $cfg := $services }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "shopsphere.labels" $root | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
---
# Shared RBAC Role for all ShopSphere services
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shopsphere.fullname" . }}-service-role
  labels:
    {{- include "shopsphere.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
{{- $root := . }}
{{- $services2 := dict
  "auth-service"         .Values.services.authService
  "product-service"      .Values.services.productService
  "cart-service"         .Values.services.cartService
  "order-service"        .Values.services.orderService
  "inventory-service"    .Values.services.inventoryService
  "notification-service" .Values.services.notificationService
  "frontend"             .Values.services.frontend
}}
{{- range $name, $cfg := $services2 }}
{{- if $cfg.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-binding
  labels:
    app: {{ $name }}
    {{- include "shopsphere.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "shopsphere.fullname" $root }}-service-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
