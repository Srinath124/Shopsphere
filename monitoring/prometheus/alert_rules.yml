groups:
  - name: shopsphere_service_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "Instance {{ $labels.instance }} of service {{ $labels.service }} has been down for more than 1 minute."

      - alert: HighHttp5xxErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service) / sum(rate(http_server_requests_seconds_count[5m])) by (service)) * 100 > 1
        for: 2m
        labels:
          severity: critical
          slo: "availability"
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} has a 5xx error rate of {{ $value | printf \"%.2f\" }}% over the last 5 minutes (threshold: > 1%)."

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service)) > 0.5
        for: 3m
        labels:
          severity: warning
          slo: "latency"
        annotations:
          summary: "High p95 latency on {{ $labels.service }}"
          description: "Service {{ $labels.service }} p95 response time is {{ $value | printf \"%.3f\" }}s (threshold: > 0.5s)."

      - alert: HighJvmMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap memory usage on {{ $labels.service }}"
          description: "JVM heap usage on {{ $labels.service }} is {{ $value | printf \"%.2f\" }}%."

      - alert: HighCpuUsage
        expr: system_cpu_usage * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High system CPU usage on {{ $labels.service }}"
          description: "CPU usage on {{ $labels.service }} is {{ $value | printf \"%.2f\" }}%."
