version: '3.8'

networks:
  shopsphere-dev-net:
    driver: bridge

volumes:
  postgres-dev-data:
  redis-dev-data:
  rabbitmq-dev-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopsphere-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password_here}
      POSTGRES_DB: auth_db
      POSTGRES_MULTIPLE_DATABASES: "product_db,order_db,inventory_db,notification_db"
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopsphere} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-dev-net

  redis:
    image: redis:7-alpine
    container_name: shopsphere-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-dev-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shopsphere-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-dev-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-dev-net
